[package]
name = "freepath_libp2p"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# https://crates.io/crates/log
log = "0.4.29"
# https://crates.io/crates/async-trait
async-trait = "0.1.89"
# https://crates.io/crates/libp2p
libp2p = { version = "0.56.0", features = [
    "tcp", "noise", "yamux",
    "identify", "ping", "relay", "tokio",
    "quic", "request-response", "dns",
    "rendezvous", "autonat", "dcutr", "upnp"
] }
# https://crates.io/crates/rand
rand = "0.8"
# https://crates.io/crates/libp2p-dns
libp2p-dns = { version = "0.44.0", features = ["tokio"] }
# https://crates.io/crates/libp2p-swarm
libp2p-swarm = { version = "0.47.1", features = ["macros"] }
# https://crates.io/crates/tokio
tokio = { version = "1.50.0", features = ["full"] }
# https://crates.io/crates/futures
futures = "0.3.32"

# https://crates.io/crates/jni
[target.'cfg(not(target_os = "ios"))'.dependencies]
jni = { version = "0.22.4", features = ["invocation"] }

# https://crates.io/crates/cbindgen
[build-dependencies]
cbindgen = { version = "0.29.2" }
